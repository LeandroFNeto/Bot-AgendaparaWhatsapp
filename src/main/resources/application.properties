spring.application.name=demo

admin.api.key=${ADMIN_API_KEY}

# Configurações do WPPConnect / Evolution API puxadas do .env
wppconnect.url=${WPPCONNECT_URL}
wppconnect.secret-key=${WPPCONNECT_SECRET_KEY}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bot_db}
spring.datasource.username=${DB_USER:admin_local}
spring.datasource.password=${DB_PASS:senha_local_123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect